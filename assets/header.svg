<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="100%" height="220" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141321" />
      <stop offset="50%" stop-color="#1a1829" />
      <stop offset="100%" stop-color="#0e0d17" />
    </linearGradient>

    <!-- Neon Pink to Cyan Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe428e" />
      <stop offset="70%" stop-color="#ff75a0" />
      <stop offset="100%" stop-color="#a9fef7" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fe428e" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#9a4dff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a9fef7" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="gridDots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#fe428e" fill-opacity="0.12" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Roboto', sans-serif;
      font-weight: 800;
      font-size: 44px;
      letter-spacing: 5px;
      fill: url(#neonGrad);
    }
    .badge-label {
      font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
      font-size: 11px;
      letter-spacing: 2px;
      fill: #a9fef7;
      opacity: 0.85;
    }
    .sub-text {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 3px;
      fill: #ffffff;
      opacity: 0.9;
    }
    .tech-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 1px;
      fill: #fe428e;
    }
  </style>

  <!-- Base Card -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#fe428e" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Grid Dots Overlay -->
  <rect width="900" height="220" rx="16" fill="url(#gridDots)" />

  <!-- Corner Tech HUD Accents -->
  <path d="M 24 45 L 24 24 L 45 24" fill="none" stroke="#fe428e" stroke-width="2" stroke-linecap="round" />
  <path d="M 876 45 L 876 24 L 855 24" fill="none" stroke="#a9fef7" stroke-width="2" stroke-linecap="round" />
  <path d="M 24 175 L 24 196 L 45 196" fill="none" stroke="#a9fef7" stroke-width="2" stroke-linecap="round" />
  <path d="M 876 175 L 876 196 L 855 196" fill="none" stroke="#fe428e" stroke-width="2" stroke-linecap="round" />

  <!-- Header HUD Tag -->
  <g transform="translate(450, 42)">
    <rect x="-120" y="-12" width="240" height="22" rx="11" fill="#141321" stroke="#fe428e" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-100" cy="-1" r="3" fill="#a9fef7" />
    <text x="5" y="3" text-anchor="middle" class="badge-label">SYS.INIT // VOID_LINUX_X86_64</text>
  </g>

  <!-- Main Title -->
  <text x="450" y="105" text-anchor="middle" class="title-text" filter="url(#neonGlow)">RIZKY BAYUU</text>

  <!-- Subtitle Tagline -->
  <text x="450" y="142" text-anchor="middle" class="sub-text">SYSTEMS TECHNOLOGIST &#x2022; LOW-LEVEL &amp; RE &#x2022; CREATIVE ENGINEER</text>

  <!-- Bottom Wave Line -->
  <path d="M 30 195 Q 225 180, 450 195 T 870 195" fill="none" stroke="url(#waveGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

  <!-- Decorative Points along bottom -->
  <circle cx="225" cy="187" r="2.5" fill="#fe428e" />
  <circle cx="450" cy="195" r="3" fill="#a9fef7" />
  <circle cx="675" cy="187" r="2.5" fill="#fe428e" />
</svg>